[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Cole" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "torch>=2.14.1",
    "transformers",
    "huggingface-hub",
    "accelerate",
]

[project.scripts]
call-me-maybe = "call_me_maybe:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.mypy]
exclude = [
    "(^|/)(.venv|llm_sdk|test)/",
]

[[tool.mypy.overrides]]
module = ["llm_sdk"]
follow_imports = "skip"
